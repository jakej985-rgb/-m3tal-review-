schema_version: protocol/1
id: device-api
version: "2.0.0"
requests:
  - name: CreateSession
    method: POST
    path: /v1/sessions
    fields:
      - name: device_id
        type: string
        required: true
      - name: ttl
        type: integer
        required: true       # breaks old clients only
        default: 300
auth:
  scheme: bearer
  required: true

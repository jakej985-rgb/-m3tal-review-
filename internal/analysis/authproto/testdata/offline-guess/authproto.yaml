schema_version: authproto/1
id: password-cr
name: Password challenge/response
parties: [client, server]
transcript:
  - name: challenge
    from: server
    to: client
    fields:
      - name: server_nonce
        kind: challenge
        fresh: true
        single_use: true
  - name: response
    from: client
    to: server
    fields:
      - name: client_nonce
        kind: nonce
        fresh: true
      - name: proof
        kind: proof
        verifier:
          type: password
        covers: [server_nonce, client_nonce]
